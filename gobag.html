<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go Bag · Project KALASAG</title>
<style>
:root{--bg:#0f1b45;--panel:#19285f;--ink:#f4f1ea;--mute:#b6bddb;--amber:#f5b335;--green:#4cae7f;--line:#34479a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:14px 14px 48px}
h1,h2{font-family:Georgia,serif;line-height:1.2}h1{font-size:1.8rem;margin:.2em 0}h2{font-size:1.2rem;margin:1.3em 0 .4em}
a{color:var(--amber)}.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--panel);border-radius:14px;padding:12px 14px;margin:10px 0;border:1px solid var(--line)}
input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:#0a1236;border:2px solid var(--line);border-radius:8px;padding:9px 10px;margin:4px 0 10px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--amber);color:#0f1b45;margin:6px 6px 0 0}
button.alt{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
button.sm{float:right;margin:0;padding:6px 12px;background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:99px;background:#0a1236;border:2px solid var(--line);cursor:pointer;font-size:.9rem}
.chip input{width:18px;height:18px;accent-color:var(--amber)}
.chip.on{border-color:var(--amber)}
.dnd{display:grid;gap:12px}
.bagp{position:sticky;top:48px;z-index:4;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:16px;background:rgba(10,18,54,.96);border:2px solid var(--line);transition:box-shadow .2s,border-color .2s}
.bagp.over{border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,179,53,.4)}
.bagp.ready{border-color:var(--amber);box-shadow:0 0 22px rgba(245,179,53,.65)}
.bagwrap{position:relative;width:118px;flex:none}
.bagwrap>svg{display:block;width:100%;height:auto}
.bsh{position:absolute;left:50%;top:27%;transform:translateX(-50%);line-height:0}
.cnt{position:absolute;right:-6px;top:-6px;background:var(--amber);color:#0f1b45;border-radius:99px;font:800 .8rem system-ui;padding:2px 9px}
.strip{display:flex;gap:6px;overflow-x:auto;flex:1;min-height:42px;align-items:center;color:var(--mute);font-size:.85rem}
.strip button{flex:none;width:40px;height:40px;padding:3px;margin:0;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.strip button svg{width:100%;height:100%;display:block}
.shelf{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:78px;gap:10px;overflow-x:auto;padding:8px 2px 10px;touch-action:pan-x}
.it{width:78px;margin:0;padding:6px 3px;border-radius:14px;background:var(--panel);border:2px solid var(--line);color:var(--ink);font:600 .72rem/1.15 system-ui;text-align:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x;-webkit-touch-callout:none}
.it svg{width:48px;height:48px;display:block;margin:0 auto 3px;pointer-events:none}
.it:hover{border-color:var(--amber)}
.ghost{position:fixed;left:0;top:0;width:58px;height:58px;z-index:60;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.ghost svg{width:100%;height:100%}
.fb{min-height:1.5em;margin:4px 0 0;color:var(--amber);font-weight:600}
.bar{height:12px;background:#0a1236;border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.pop{animation:pop .35s}.shake{animation:shk .4s}
@keyframes pop{40%{transform:scale(1.08)}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pl{display:none}
@media (min-width:760px){
 .dnd{grid-template-columns:1fr 250px;align-items:start}
 .bagp{order:2;flex-direction:column;top:56px}.bagwrap{width:190px}
 .strip{flex-wrap:wrap;overflow:visible;justify-content:center}
 .shelf{grid-auto-flow:row;grid-template-columns:repeat(4,78px);overflow:visible;touch-action:auto}
 .it{touch-action:none}
}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}}
@media print{body{background:#fff;color:#000}.noprint,.dnd{display:none!important}.pl{display:block}.card{background:#fff;border:1px solid #999}}
</style>
</head>
<body>
<main>
<button id="lg" class="sm noprint"></button>
<p class="mute noprint"><a href="index.html" data-k="back"></a></p>
<h1 data-k="h1"></h1>
<p class="noprint" data-k="intro"></p>

<section class="card noprint">
 <label for="size" data-k="size"></label>
 <input id="size" type="number" min="1" max="12" value="1" inputmode="numeric">
 <p class="mute" style="margin:0 0 6px" data-k="vuln"></p>
 <div class="chips" id="vul"></div>
</section>

<section class="dnd">
 <div class="bagp" id="bagp" role="region" aria-labelledby="bagl">
  <div class="bagwrap" id="bagw">
   <svg viewBox="0 0 240 270" aria-hidden="true">
    <path d="M88 44a32 32 0 0 1 64 0" fill="none" stroke="#a56b0c" stroke-width="11" stroke-linecap="round"/>
    <path d="M30 120q-16 22 0 70M210 120q16 22 0 70" fill="none" stroke="#a56b0c" stroke-width="10" stroke-linecap="round"/>
    <rect x="30" y="40" width="180" height="214" rx="56" fill="#2a42a6" stroke="#f5b335" stroke-width="6"/>
    <rect x="54" y="156" width="132" height="76" rx="22" fill="#19285f" stroke="#34479a" stroke-width="3"/>
    <path d="M54 176h132" stroke="#f5b335" stroke-width="3" stroke-dasharray="7 7"/>
   </svg>
   <div class="bsh" id="bsh"></div><span class="cnt" id="cnt"></span>
  </div>
  <div class="strip" id="strip" aria-live="polite"></div>
  <span id="bagl" hidden data-k="bagl"></span>
 </div>
 <div>
  <h2 style="margin-top:0" data-k="tray"></h2>
  <p class="mute" style="margin:0" data-k="hint"></p>
  <div class="shelf" id="shelf"></div>
  <p class="fb" id="fb" role="status"></p>
 </div>
</section>

<h2 class="noprint" data-k="go"></h2>
<div class="card noprint">
 <label for="evac" data-k="evac"></label><input id="evac" type="text">
 <label for="meet" data-k="meet"></label><input id="meet" type="text">
 <label for="contact" data-k="contact"></label><input id="contact" type="text">
</div>

<h2 class="noprint" data-k="stand"></h2>
<div class="card noprint">
 <div class="bar"><i id="fill"></i></div>
 <p id="sum"></p>
 <ul id="need"></ul>
</div>
<button id="save" class="noprint" data-k="save"></button><span id="saved" class="mute noprint" role="status"></span>
<button id="print" class="alt noprint" data-k="print"></button>
<button id="reset" class="alt noprint" data-k="reset"></button>
<div class="pl" id="plist"></div>
<p class="mute noprint" data-k="note"></p>
</main>
<script src="profile.js"></script>
<script>
const T={en:{back:"Back to menu",h1:"Pack your go bag",intro:"Drag each item into the KALASAG go bag, or just tap it. Only pack what you could really grab and carry. Your bag feeds your simulations, where an empty bag has consequences.",
size:"How many people will you pack for?",vuln:"Anyone in your home who needs extra items:",tray:"Your shelf",hint:"Drag an item into the bag, or tap it. Tap a packed item to take it out.",bagl:"Your go bag",
go:"Where you will go",evac:"Evacuation center",meet:"Family meeting place",contact:"Emergency contact",ph1:"Ask your barangay hall",ph2:"If you get separated",ph3:"Name and number",
stand:"Where you stand",save:"Save",print:"Print my checklist",reset:"Clear my answers",saved:"Saved on this device.",lg:"Filipino",
empty:"Your bag is empty. Drag something in.",packed:"Packed",of:"of",miss:"Still missing:",done:"Your bag is complete. Check and restock it every three months.",
ready:"Go bag ready.",cf:"Clear your go-bag answers?",plt:"Go-bag checklist",
note:"Based on go-bag lists reported from OCD, NDRRMC and DSWD guidance (72 hours of supplies, checked every three months). Household extras and the decoy items are suggestions for learning. Have a nurse or your barangay DRRM office review before wide release."},
tl:{back:"Bumalik sa menu",h1:"Ihanda ang inyong go bag",intro:"I-drag ang bawat gamit sa go bag ng KALASAG, o i-tap lang ito. Ihanda lang ang tunay ninyong madadampot at madadala. Ginagamit ng inyong mga simulation ang bag ninyo, kung saan may bunga ang walang laman na bag.",
size:"Ilan ang ihahanda ninyo?",vuln:"Sinumang nangangailangan ng dagdag na gamit sa inyong tahanan:",tray:"Ang inyong istante",hint:"I-drag ang gamit sa bag, o i-tap ito. I-tap ang nasa bag para ilabas ito.",bagl:"Ang inyong go bag",
go:"Saan kayo pupunta",evac:"Evacuation center",meet:"Lugar ng pagkikita ng pamilya",contact:"Emergency contact",ph1:"Itanong sa barangay hall",ph2:"Kung magkahiwalay kayo",ph3:"Pangalan at numero",
stand:"Kinalalagyan ninyo",save:"I-save",print:"I-print ang aking checklist",reset:"Burahin ang aking mga sagot",saved:"Na-save sa device na ito.",lg:"English",
empty:"Walang laman ang bag. Mag-drag ng gamit dito.",packed:"Nakahanda",of:"sa",miss:"Kulang pa:",done:"Kumpleto na ang inyong bag. Suriin at punuin ito tuwing tatlong buwan.",
ready:"Handa na ang go bag.",cf:"Burahin ang mga sagot sa go bag?",plt:"Checklist ng go bag",
note:"Batay sa mga listahan ng go bag mula sa gabay ng OCD, NDRRMC at DSWD (suplay para sa 72 oras, sinusuri tuwing tatlong buwan). Mga mungkahi para sa pagkatuto ang mga dagdag para sa sambahayan at ang mga pamburang gamit. Ipasuri sa nars o sa DRRM office ng barangay bago ilabas sa publiko."}};
/* id, core, name EN, name TL, description EN, description TL */
const ITEMS=[
["docs",1,"Documents","Dokumento","IDs, birth certificates and insurance papers in a waterproof pouch","ID, birth certificate at papeles ng insurance sa waterproof na lalagyan"],
["water",1,"Water","Tubig","Drinking water for everyone for 72 hours","Inuming tubig para sa lahat sa loob ng 72 oras"],
["food",1,"Food","Pagkain","Ready-to-eat food for everyone for 72 hours","Pagkaing handa nang kainin para sa lahat sa loob ng 72 oras"],
["meds",1,"Medicines","Gamot","Your regular medicines and any prescriptions","Inyong regular na gamot at anumang reseta"],
["aid",1,"First aid","First aid","First-aid kit","First-aid kit"],
["hyg",0,"Hygiene","Hygiene","Hygiene kit: soap, toothbrush, sanitary items","Hygiene kit: sabon, sepilyo, sanitary items"],
["mask",0,"N95 mask","N95 mask","N95 or dust mask","N95 o dust mask"],
["light",1,"Flashlight","Flashlight","Flashlight with spare batteries","Flashlight na may dagdag na baterya"],
["power",1,"Power bank","Power bank","Charged power bank","Naka-charge na power bank"],
["whistle",1,"Whistle","Pito","Whistle to call for help","Pito para humingi ng tulong"],
["cash",1,"Cash","Pera","Emergency cash in small bills","Emergency cash sa maliliit na denominasyon"],
["clothes",0,"Clothes","Damit","Extra clothes and a blanket","Dagdag na damit at kumot"],
["boots",0,"Boots","Bota","Boots or closed shoes you can wade in","Bota o saradong sapatos na puwedeng panlusong"]];
const VUL={infant:["Infant or toddler","Sanggol o bata","Baby supplies","Gamit ng sanggol","Formula or baby food, diapers and wipes","Formula o pagkain ng sanggol, diaper at wipes"],
elder:["Elderly","Matanda","Maintenance meds","Maintenance na gamot","Maintenance medicines and a list of prescriptions","Maintenance na gamot at listahan ng reseta"],
preg:["Pregnant","Buntis","Prenatal records","Prenatal records","Prenatal records and vitamins","Prenatal records at bitamina"],
pwd:["Person with a disability","May kapansanan","Spare batteries","Dagdag na baterya","Spare batteries or parts for assistive devices","Dagdag na baterya o piyesa para sa assistive device"],
pet:["Pet","Alagang hayop","Pet food","Pagkain ng alaga","Pet food and a leash or carrier","Pagkain ng alaga at tali o carrier"]};
const DEC={tv:["TV","TV","Admirable ambition. The go bag has no outlet.","Kapuri-puri ang ambisyon. Walang saksakan ang go bag."],
rice:["Rice cooker","Rice cooker","Replaceable. The go bag has no kitchen.","Napapalitan ito. Walang kusina ang go bag."],
laptop:["Laptop","Laptop","Replaceable. Back up the files, pack the water.","Napapalitan ito. I-back up ang files, ihanda ang tubig."]};
const ORDER=["docs","water","tv","food","meds","aid","rice","light","power","whistle","cash","hyg","laptop","mask","clothes","boots"];
const IC={
docs:'<rect x="9" y="12" width="30" height="26" rx="4" fill="#3b82c4"/><rect x="14" y="8" width="20" height="8" rx="2" fill="#9ec8ee"/><path d="M17 24h14M17 30h10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>',
water:'<rect x="18" y="5" width="12" height="7" rx="2" fill="#9ec8ee"/><path d="M16 14h16l2 6v20a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V20z" fill="#4aa8e0"/><rect x="14" y="25" width="20" height="8" fill="#fff" opacity=".7"/>',
food:'<rect x="11" y="14" width="26" height="27" rx="3" fill="#e0872b"/><rect x="11" y="14" width="26" height="6" fill="#b86a1c"/><circle cx="24" cy="31" r="5" fill="#fff" opacity=".85"/>',
meds:'<rect x="14" y="8" width="20" height="9" rx="2" fill="#e8e8e8"/><rect x="13" y="17" width="22" height="24" rx="3" fill="#e0662b"/><rect x="13" y="24" width="22" height="10" fill="#fff"/><path d="M24 25.5v7M20.5 29h7" stroke="#d8452f" stroke-width="2.5"/>',
aid:'<rect x="7" y="14" width="34" height="25" rx="5" fill="#d8452f"/><path d="M18 14v-3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3" fill="none" stroke="#a82a1c" stroke-width="3"/><path d="M24 20v13M17.5 26.5h13" stroke="#fff" stroke-width="4" stroke-linecap="round"/>',
hyg:'<rect x="9" y="23" width="30" height="16" rx="6" fill="#7cc6a4"/><circle cx="16" cy="15" r="4" fill="#cdeee0"/><circle cx="26" cy="11" r="5" fill="#cdeee0"/><circle cx="35" cy="17" r="3" fill="#cdeee0"/>',
mask:'<path d="M9 22c0-5 6-8 15-8s15 3 15 8c0 8-6 14-15 14S9 30 9 22z" fill="#f2f2f2" stroke="#b8c0d0" stroke-width="2"/><path d="M9 22H3M39 22h6" stroke="#b8c0d0" stroke-width="2.5" stroke-linecap="round"/><path d="M15 22h18" stroke="#cfd5e3" stroke-width="2"/>',
light:'<path d="M14 10h20l-4 13H18z" fill="#f5b335"/><rect x="17" y="23" width="14" height="21" rx="3" fill="#444c6b"/><path d="M24 2v4M10 6l3 3M38 6l-3 3" stroke="#f5b335" stroke-width="2.5" stroke-linecap="round"/>',
power:'<rect x="12" y="7" width="24" height="35" rx="5" fill="#2f45a8"/><path d="M27 14l-7 11h5l-2 10 8-13h-5z" fill="#f5b335"/>',
whistle:'<circle cx="18" cy="28" r="12" fill="#d8452f"/><rect x="26" y="16" width="16" height="8" rx="3" fill="#a82a1c"/><circle cx="18" cy="28" r="4" fill="#f4f1ea"/>',
cash:'<rect x="4" y="14" width="40" height="22" rx="3" fill="#4cae7f"/><circle cx="24" cy="25" r="6.5" fill="#dff5e8"/><circle cx="10" cy="25" r="2" fill="#dff5e8"/><circle cx="38" cy="25" r="2" fill="#dff5e8"/>',
clothes:'<path d="M17 7L5 14l5 8 5-3v22h18V19l5 3 5-8-12-7c-1 3-4 5-7 5s-6-2-7-5z" fill="#6b84d8"/>',
boots:'<path d="M15 5h15v22l11 5v11H11V5z" fill="#f5b335"/><rect x="11" y="39" width="30" height="4" fill="#a56b0c"/>',
x_infant:'<rect x="19" y="5" width="10" height="7" rx="2" fill="#f4a6c0"/><rect x="15" y="12" width="18" height="30" rx="6" fill="#fde7ef" stroke="#f4a6c0" stroke-width="2"/><path d="M15 22h18M15 29h18" stroke="#f4a6c0" stroke-width="2"/>',
x_elder:'<rect x="5" y="15" width="38" height="22" rx="4" fill="#8e7cc3"/><path d="M15 15v22M24 15v22M33 15v22" stroke="#fff" stroke-width="2"/>',
x_preg:'<rect x="9" y="8" width="30" height="33" rx="4" fill="#f08fb0"/><path d="M24 34c-7-4-9-8-9-11a4.5 4.5 0 0 1 9-1.5 4.5 4.5 0 0 1 9 1.5c0 3-2 7-9 11z" fill="#fff"/>',
x_pwd:'<rect x="7" y="15" width="31" height="20" rx="3" fill="#2aa6a0"/><rect x="38" y="21" width="4" height="8" rx="1" fill="#2aa6a0"/><path d="M21 19l-5 7h5l-2 7 8-9h-5z" fill="#fff"/>',
x_pet:'<ellipse cx="24" cy="33" rx="17" ry="5" fill="#e5b27a"/><path d="M8 33l4 9h24l4-9z" fill="#c98a4a"/><circle cx="18" cy="28" r="3.2" fill="#8a5a2b"/><circle cx="26" cy="25.5" r="3.2" fill="#8a5a2b"/><circle cx="32" cy="29" r="3.2" fill="#8a5a2b"/>',
tv:'<rect x="5" y="9" width="38" height="25" rx="3" fill="#2b2f42"/><rect x="9" y="13" width="30" height="17" fill="#7aa7e8"/><rect x="15" y="38" width="18" height="3" fill="#2b2f42"/>',
rice:'<path d="M11 19a13 11 0 0 1 26 0z" fill="#e8e8e8"/><rect x="9" y="19" width="30" height="21" rx="4" fill="#f4f1ea"/><circle cx="24" cy="29" r="3.2" fill="#d8452f"/>',
laptop:'<rect x="9" y="11" width="30" height="20" rx="2" fill="#2b2f42"/><rect x="12" y="14" width="24" height="14" fill="#9ec8ee"/><path d="M4 34h40l-3 5H7z" fill="#8a90a8"/>'};
const svg=id=>`<svg viewBox="0 0 48 48" aria-hidden="true">${IC[id]}</svg>`;
const $=s=>document.querySelector(s);
const st=KP.get().p3||{};
let L=KP.lang(),packed=new Set(st.packed||[]),vuln=new Set((st.household||{}).vuln||[]),drag=null;
const li=()=>L==="en"?0:1,tt=k=>T[L][k];
$("#size").value=(st.household||{}).size||1;
const plan=st.plan||{};["evac","meet","contact"].forEach(k=>$("#"+k).value=plan[k]||"");

function realItems(){
 const a=ITEMS.map(x=>({id:x[0],core:x[1],n:x[2+li()],d:x[4+li()]}));
 vuln.forEach(v=>a.push({id:"x_"+v,core:0,x:1,n:VUL[v][2+li()],d:VUL[v][4+li()]}));
 return a;
}
function shelfList(){
 const real=realItems(),by={};real.forEach(x=>by[x.id]=x);
 const out=[];ORDER.forEach(id=>{if(DEC[id])out.push({id,dec:1,n:DEC[id][li()]});else if(by[id])out.push(by[id])});
 real.filter(x=>x.x).forEach(x=>out.push(x));
 return out;
}
function draw(){
 const t=tt;document.documentElement.lang=L;
 document.querySelectorAll("[data-k]").forEach(e=>e.textContent=t(e.dataset.k));
 $("#lg").textContent=t("lg");$("#evac").placeholder=t("ph1");$("#meet").placeholder=t("ph2");$("#contact").placeholder=t("ph3");
 $("#bsh").innerHTML=KP.shield(50);
 $("#vul").innerHTML=Object.keys(VUL).map(k=>`<label class="chip ${vuln.has(k)?"on":""}"><input type="checkbox" data-v="${k}" ${vuln.has(k)?"checked":""}>${VUL[k][li()]}</label>`).join("");
 document.querySelectorAll("[data-v]").forEach(e=>e.onchange=()=>{const k=e.dataset.v;if(e.checked)vuln.add(k);else{vuln.delete(k);packed.delete("x_"+k)}draw();save()});
 refresh();
}
function refresh(){
 const real=realItems(),done=real.filter(x=>packed.has(x.id));
 $("#shelf").innerHTML=shelfList().filter(x=>x.dec||!packed.has(x.id)).map(x=>`<button class="it" data-id="${x.id}" ${x.dec?'data-dec="1"':""} aria-label="${(x.d||x.n).replace(/"/g,"&quot;")}">${svg(x.id)}${x.n}</button>`).join("");
 $("#strip").innerHTML=done.length?done.map(x=>`<button data-out="${x.id}" aria-label="${x.n}" title="${x.n}">${svg(x.id)}</button>`).join(""):tt("empty");
 $("#strip").querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{packed.delete(b.dataset.out);refresh();save()});
 $("#cnt").textContent=done.length+"/"+real.length;
 const miss=real.filter(x=>(x.core||x.x)&&!packed.has(x.id));
 $("#fill").style.width=Math.round(done.length/real.length*100)+"%";
 $("#sum").textContent=miss.length?`${tt("packed")} ${done.length} ${tt("of")} ${real.length}. ${tt("miss")}`:tt("done");
 $("#need").innerHTML=miss.map(x=>`<li>${x.d}</li>`).join("");
 $("#bagp").classList.toggle("ready",!real.some(x=>x.core&&!packed.has(x.id)));
 $("#plist").innerHTML=`<h2>${tt("plt")}</h2>`+real.map(x=>`<p>${packed.has(x.id)?"☑":"☐"} ${x.d}</p>`).join("");
}
function say(m){$("#fb").textContent=m}
function pack(id){
 const x=realItems().find(y=>y.id===id);if(!x||packed.has(id))return;
 packed.add(id);refresh();save();say(`${tt("packed")}: ${x.n}`);
 const b=$("#bagw");b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
}
function attempt(id){
 if(DEC[id]){say(DEC[id][2+li()]);const b=$("#bagw");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");return}
 pack(id);
}
const hit=e=>{const r=$("#bagp").getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom};
function ghost(it){const g=document.createElement("div");g.className="ghost";g.innerHTML=it.querySelector("svg").outerHTML;document.body.appendChild(g);return g}
$("#shelf").addEventListener("pointerdown",e=>{
 const it=e.target.closest(".it");if(!it||(e.button&&e.button>0))return;
 drag={it,id:it.dataset.id,x:e.clientX,y:e.clientY,go:false,g:null};
});
document.addEventListener("pointermove",e=>{
 if(!drag)return;
 if(!drag.go&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.go=true;drag.g=ghost(drag.it)}
 if(drag.go){drag.g.style.transform=`translate(${e.clientX-29}px,${e.clientY-29}px)`;$("#bagp").classList.toggle("over",hit(e))}
});
function end(e,cancel){
 if(!drag)return;const d=drag;drag=null;if(d.g)d.g.remove();$("#bagp").classList.remove("over");
 if(cancel)return;
 if(!d.go||hit(e))attempt(d.id);
}
document.addEventListener("pointerup",e=>end(e,false));
document.addEventListener("pointercancel",e=>end(e,true));
$("#shelf").addEventListener("click",e=>{const it=e.target.closest(".it");if(it&&e.detail===0)attempt(it.dataset.id)});
$("#shelf").addEventListener("contextmenu",e=>e.preventDefault());

function save(){
 const f={};ITEMS.forEach(x=>f[x[0]]=packed.has(x[0]));
 const core=ITEMS.filter(x=>x[1]),n=core.filter(x=>f[x[0]]).length;
 const p={evac:$("#evac").value.trim(),meet:$("#meet").value.trim(),contact:$("#contact").value.trim()};
 const ids=new Set(realItems().map(x=>x.id)),keep=[...packed].filter(i=>ids.has(i));
 KP.set("p3",{household:{size:+$("#size").value||1,vuln:[...vuln]},packed:keep,flags:f,
  level:n===0?"none":n===core.length?"ready":"partial",plan:p,hasPlan:!!(p.evac&&p.meet),goBagDate:Date.now()});
}
["size","evac","meet","contact"].forEach(k=>$("#"+k).oninput=save);
$("#save").onclick=()=>{save();say("");$("#saved").textContent=tt("saved")};
$("#print").onclick=()=>window.print();
$("#reset").onclick=()=>{if(confirm(tt("cf"))){packed.clear();vuln.clear();["evac","meet","contact"].forEach(k=>$("#"+k).value="");$("#size").value=1;draw();save()}};
$("#lg").onclick=()=>{L=L==="en"?"tl":"en";KP.setLang(L);$("#saved").textContent="";say("");draw()};
draw();
</script>
</body>
</html>
