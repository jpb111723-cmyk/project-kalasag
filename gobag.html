<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go Bag · Project KALASAG</title>
<style>
:root{--bg:#0f1b45;--panel:#19285f;--ink:#f4f1ea;--mute:#b6bddb;--amber:#f5b335;--green:#4cae7f;--line:#34479a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:14px 14px 48px}
h1,h2{font-family:var(--font);line-height:1.2}h1{font-size:1.8rem;margin:.2em 0}h2{font-size:1.2rem;margin:1.3em 0 .4em}
a{color:var(--amber)}.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--panel);border-radius:14px;padding:12px 14px;margin:10px 0;border:1px solid var(--line)}
input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:#0a1236;border:2px solid var(--line);border-radius:8px;padding:9px 10px;margin:4px 0 10px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--amber);color:#0f1b45;margin:6px 6px 0 0}
button.alt{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
button.sm{float:right;margin:0;padding:6px 12px;background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:99px;background:#0a1236;border:2px solid var(--line);cursor:pointer;font-size:.9rem}
.chip input{width:18px;height:18px;accent-color:var(--amber)}
.chip.on{border-color:var(--amber)}
.dnd{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.dnd>*{min-width:0}
.bagp{position:sticky;top:48px;z-index:4;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:16px;background:rgba(10,18,54,.96);border:2px solid var(--line);transition:box-shadow .2s,border-color .2s}
.bagp.over{border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,179,53,.4)}
.bagp.ready{border-color:var(--amber);box-shadow:0 0 22px rgba(245,179,53,.65)}
.bagwrap{position:relative;width:118px;flex:none}
.bagwrap>svg{display:block;width:100%;height:auto}
.bsh{position:absolute;left:50%;top:27%;transform:translateX(-50%);line-height:0}
.cnt{position:absolute;right:-6px;top:-6px;background:var(--amber);color:#0f1b45;border-radius:99px;font:800 .8rem system-ui;padding:2px 9px}
.strip{display:flex;gap:6px;overflow-x:auto;flex:1;min-height:42px;align-items:center;color:var(--mute);font-size:.85rem}
.strip button{flex:none;width:40px;height:40px;padding:3px;margin:0;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.strip button svg{width:100%;height:100%;display:block}
.shelf{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:78px;gap:10px;overflow-x:auto;padding:8px 2px 10px;touch-action:pan-x}
.it{width:78px;margin:0;padding:6px 3px;border-radius:14px;background:var(--panel);border:2px solid var(--line);color:var(--ink);font:600 .72rem/1.15 system-ui;text-align:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x;-webkit-touch-callout:none}
.it svg{width:48px;height:48px;display:block;margin:0 auto 3px;pointer-events:none}
.it:hover{border-color:var(--amber)}
.ghost{position:fixed;left:0;top:0;width:58px;height:58px;z-index:60;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.ghost svg{width:100%;height:100%}
.fb{min-height:1.5em;margin:4px 0 0;color:var(--amber);font-weight:600}
.bar{height:12px;background:#0a1236;border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.pop{animation:pop .35s}.shake{animation:shk .4s}
@keyframes pop{40%{transform:scale(1.08)}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pl{display:none}
.it{position:relative}
.pts{position:absolute;top:3px;right:6px;font:700 .68rem var(--font);color:var(--amber)}
.sp{flex:1;min-width:0}
.meter{height:12px;background:#0a1236;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
.meter i.full{background:#d8452f}
.mlbl{margin:3px 0 6px;font:700 .8rem var(--font);color:var(--amber)}
@media (min-width:760px){
 .sp{width:100%}
 .dnd{grid-template-columns:minmax(0,1fr) 250px;align-items:start}
 .bagp{order:2;flex-direction:column;top:56px}.bagwrap{width:190px}
 .strip{flex-wrap:wrap;overflow:visible;justify-content:center}
 .shelf{grid-auto-flow:row;grid-template-columns:repeat(4,78px);overflow:visible;touch-action:auto}
 .it{touch-action:none}
}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}}
@media print{body{background:#fff;color:#000}.noprint,.dnd{display:none!important}.pl{display:block}.card{background:#fff;border:1px solid #999}}
</style>
</head>
<body>
<main>
<button id="lg" class="sm noprint"></button>
<p class="mute noprint"><a href="index.html" data-k="back"></a></p>
<h1 data-k="h1"></h1>
<p class="noprint" data-k="intro"></p>

<section class="card noprint">
 <label for="size" data-k="size"></label>
 <input id="size" type="number" min="1" max="12" value="1" inputmode="numeric">
 <p class="mute" style="margin:0 0 6px" data-k="vuln"></p>
 <div class="chips" id="vul"></div>
</section>

<section class="dnd">
 <div class="bagp" id="bagp" role="region" aria-labelledby="bagl">
  <div class="bagwrap" id="bagw">
   <svg viewBox="0 0 240 270" aria-hidden="true">
    <path d="M88 44a32 32 0 0 1 64 0" fill="none" stroke="#a56b0c" stroke-width="11" stroke-linecap="round"/>
    <path d="M30 120q-16 22 0 70M210 120q16 22 0 70" fill="none" stroke="#a56b0c" stroke-width="10" stroke-linecap="round"/>
    <rect x="30" y="40" width="180" height="214" rx="56" fill="#2a42a6" stroke="#f5b335" stroke-width="6"/>
    <rect x="54" y="156" width="132" height="76" rx="22" fill="#19285f" stroke="#34479a" stroke-width="3"/>
    <path d="M54 176h132" stroke="#f5b335" stroke-width="3" stroke-dasharray="7 7"/>
   </svg>
   <div class="bsh" id="bsh"></div><span class="cnt" id="cnt"></span>
  </div>
  <div class="sp"><div class="meter"><i id="mfill"></i></div><div class="mlbl" id="mlbl"></div><div class="strip" id="strip" aria-live="polite"></div></div>
  <span id="bagl" hidden data-k="bagl"></span>
 </div>
 <div>
  <h2 style="margin-top:0" data-k="tray"></h2>
  <p class="mute" style="margin:0" data-k="hint"></p>
  <div class="shelf" id="shelf"></div>
  <p class="fb" id="fb" role="status"></p>
 </div>
</section>

<h2 class="noprint" data-k="go"></h2>
<div class="card noprint">
 <label for="evac" data-k="evac"></label><input id="evac" type="text">
 <label for="meet" data-k="meet"></label><input id="meet" type="text">
 <label for="contact" data-k="contact"></label><input id="contact" type="text">
</div>

<h2 class="noprint" data-k="stand"></h2>
<div class="card noprint">
 <div class="bar"><i id="fill"></i></div>
 <p id="sum"></p>
 <ul id="need"></ul>
 <p class="mute" id="junk"></p>
</div>
<button id="save" class="noprint" data-k="save"></button><span id="saved" class="mute noprint" role="status"></span>
<button id="print" class="alt noprint" data-k="print"></button>
<button id="reset" class="alt noprint" data-k="reset"></button>
<a class="nextbtn noprint" href="sim.html" data-k="next"></a>
<div class="pl" id="plist"></div>
<p class="mute noprint" data-k="note"></p>
</main>

dryer:'<path d="M8 12h24a6 6 0 0 1 0 14H8z" fill="#d86b9a"/><rect x="18" y="24" width="9" height="18" rx="3" fill="#a23c6d"/><rect x="32" y="15" width="8" height="8" fill="#f4f1ea"/>',
console:'<rect x="6" y="18" width="36" height="16" rx="8" fill="#3d4466"/><path d="M14 22v8M10 26h8" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/><circle cx="32" cy="24" r="2.4" fill="#d8452f"/><circle cx="37" cy="28" r="2.4" fill="#4cae7f"/>',
laptop:'<rect x="9" y="11" width="30" height="20" rx="2" fill="#2b2f42"/><rect x="12" y="14" width="24" height="14" fill="#9ec8ee"/><path d="M4 34h40l-3 5H7z" fill="#8a90a8"/>'};
const svg=id=>`<svg viewBox="0 0 48 48" aria-hidden="true">${IC[id]}</svg>`;
const $=s=>document.querySelector(s);
const st=KP.get().p3||{};
let L=KP.lang(),packed=new Set(st.packed||[]),vuln=new Set((st.household||{}).vuln||[]),drag=null;
const li=()=>L==="en"?0:1,tt=k=>T[L][k];
$("#size").value=(st.household||{}).size||1;
const plan=st.plan||{};["evac","meet","contact"].forEach(k=>$("#"+k).value=plan[k]||"");

const size=()=>Math.max(1,Math.min(12,+$("#size").value||1));
const cap=()=>20+6*(size()-1);
function realItems(){
 const a=ITEMS.map(x=>({id:x[0],core:x[1],n:x[2+li()],d:x[4+li()],p:PTS[x[0]]+((x[0]==="water"||x[0]==="food")?2*(size()-1):0)}));
 vuln.forEach(v=>a.push({id:"x_"+v,core:0,x:1,n:VUL[v][2+li()],d:VUL[v][4+li()],p:PTS["x_"+v]}));
 return a;
}
const decoys=()=>Object.keys(DEC).map(id=>({id,dec:1,n:DEC[id][li()],d:DEC[id][li()],p:DEC[id][4]}));
const everything=()=>realItems().concat(decoys());
const used=()=>everything().filter(x=>packed.has(x.id)).reduce((a,x)=>a+x.p,0);
function shelfList(){
 const by={};everything().forEach(x=>by[x.id]=x);
 const out=[];ORDER.forEach(id=>{if(by[id])out.push(by[id])});
 realItems().filter(x=>x.x).forEach(x=>out.push(x));
 return out;
}
function draw(){
 const t=tt;document.documentElement.lang=L;
 document.querySelectorAll("[data-k]").forEach(e=>e.textContent=t(e.dataset.k));
 $("#lg").textContent=t("lg");$("#evac").placeholder=t("ph1");$("#meet").placeholder=t("ph2");$("#contact").placeholder=t("ph3");
 $("#bsh").innerHTML=KP.shield(50);
 $("#vul").innerHTML=Object.keys(VUL).map(k=>`<label class="chip ${vuln.has(k)?"on":""}"><input type="checkbox" data-v="${k}" ${vuln.has(k)?"checked":""}>${VUL[k][li()]}</label>`).join("");
 document.querySelectorAll("[data-v]").forEach(e=>e.onchange=()=>{const k=e.dataset.v;if(e.checked)vuln.add(k);else{vuln.delete(k);packed.delete("x_"+k)}draw();save()});
 refresh();
}
function refresh(){
 const real=realItems(),all=everything(),done=real.filter(x=>packed.has(x.id)),u=used(),c=cap();
 $("#shelf").innerHTML=shelfList().filter(x=>!packed.has(x.id)).map(x=>`<button class="it" data-id="${x.id}" aria-label="${(x.d||x.n).replace(/"/g,"&quot;")} (${x.p})">${svg(x.id)}<b class="pts">${x.p}</b>${x.n}</button>`).join("");
 const inBag=all.filter(x=>packed.has(x.id));
 $("#strip").innerHTML=inBag.length?inBag.map(x=>`<button data-out="${x.id}" aria-label="${x.n}" title="${x.n} (${x.p})">${svg(x.id)}</button>`).join(""):tt("empty");
 $("#strip").querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{packed.delete(b.dataset.out);refresh();save()});
 $("#cnt").textContent=u+"/"+c;
 $("#mfill").style.width=Math.min(100,Math.round(u/c*100))+"%";$("#mfill").className=u>=c?"full":"";
 $("#mlbl").textContent=`${tt("space")}: ${u}/${c}`+(u>c?" · "+tt("over"):"");
 const miss=real.filter(x=>(x.core||x.x)&&!packed.has(x.id));
 $("#fill").style.width=Math.round(done.length/real.length*100)+"%";
 $("#sum").textContent=miss.length?`${tt("packed")} ${done.length} ${tt("of")} ${real.length}. ${tt("miss")}`:tt("done");
 $("#need").innerHTML=miss.map(x=>`<li>${x.d}</li>`).join("");
 const junk=all.filter(x=>x.dec&&packed.has(x.id));
 $("#junk").textContent=junk.length?`${tt("junk")} ${junk.map(x=>x.n).join(", ")} (${junk.reduce((a,x)=>a+x.p,0)} ${tt("pts")}).`:"";
 $("#bagp").classList.toggle("ready",!real.some(x=>x.core&&!packed.has(x.id)));
 $("#plist").innerHTML=`<h2>${tt("plt")}</h2>`+real.map(x=>`<p>${packed.has(x.id)?"☑":"☐"} ${x.d}</p>`).join("");
}
function say(m){$("#fb").textContent=m}
function shakeBag(){const b=$("#bagw");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}
function pack(id){
 const x=everything().find(y=>y.id===id);if(!x||packed.has(id))return;
 const left=cap()-used();
 if(x.p>left){say(tt("noroom").replace("{n}",x.p).replace("{m}",Math.max(0,left)));shakeBag();return}
 packed.add(id);refresh();save();
 say(x.dec?DEC[id][2+li()]:`${tt("packed")}: ${x.n}`);
 const b=$("#bagw");b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
}
const attempt=pack;
const hit=e=>{const r=$("#bagp").getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom};
function ghost(it){const g=document.createElement("div");g.className="ghost";g.innerHTML=it.querySelector("svg").outerHTML;document.body.appendChild(g);return g}
$("#shelf").addEventListener("pointerdown",e=>{
 const it=e.target.closest(".it");if(!it||(e.button&&e.button>0))return;
 drag={it,id:it.dataset.id,x:e.clientX,y:e.clientY,go:false,g:null};
});
document.addEventListener("pointermove",e=>{
 if(!drag)return;
 if(!drag.go&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.go=true;drag.g=ghost(drag.it)}
 if(drag.go){drag.g.style.transform=`translate(${e.clientX-29}px,${e.clientY-29}px)`;$("#bagp").classList.toggle("over",hit(e))}
});
function end(e,cancel){
 if(!drag)return;const d=drag;drag=null;if(d.g)d.g.remove();$("#bagp").classList.remove("over");
 if(cancel)return;
 if(!d.go||hit(e))attempt(d.id);
}
document.addEventListener("pointerup",e=>end(e,false));
document.addEventListener("pointercancel",e=>end(e,true));
$("#shelf").addEventListener("click",e=>{const it=e.target.closest(".it");if(it&&e.detail===0)attempt(it.dataset.id)});
$("#shelf").addEventListener("contextmenu",e=>e.preventDefault());

function save(){
 const f={};ITEMS.forEach(x=>f[x[0]]=packed.has(x[0]));
 const core=ITEMS.filter(x=>x[1]),n=core.filter(x=>f[x[0]]).length;
 const p={evac:$("#evac").value.trim(),meet:$("#meet").value.trim(),contact:$("#contact").value.trim()};
 const ids=new Set(everything().map(x=>x.id)),keep=[...packed].filter(i=>ids.has(i));
 KP.set("p3",{household:{size:size(),vuln:[...vuln]},packed:keep,flags:f,
  level:n===0?"none":n===core.length?"ready":"partial",plan:p,hasPlan:!!(p.evac&&p.meet),goBagDate:Date.now(),used:used(),cap:cap(),junk:keep.filter(i=>DEC[i])});
}
["evac","meet","contact"].forEach(k=>$("#"+k).oninput=save);
$("#size").oninput=()=>{refresh();save()};
$("#save").onclick=()=>{save();say("");$("#saved").textContent=tt("saved")};
$("#print").onclick=()=>window.print();
$("#reset").onclick=()=>{if(confirm(tt("cf"))){packed.clear();vuln.clear();["evac","meet","contact"].forEach(k=>$("#"+k).value="");$("#size").value=1;draw();save()}};
$("#lg").onclick=()=>{L=L==="en"?"tl":"en";KP.setLang(L);$("#saved").textContent="";say("");draw()};
draw();
</script>
</body>
</html>
