<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project KALASAG</title>
<style>
:root{--bg:#12303f;--panel:#1b4152;--ink:#e9f1f4;--mute:#a9c3cd;--amber:#f2b441;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font:700 2.2rem/1.15 Georgia,serif;margin:.1em 0 .3em}
a.card{display:block;background:var(--panel);border:2px solid #2d5e74;border-radius:14px;padding:14px 16px;margin:12px 0;color:var(--ink);text-decoration:none}
a.card:hover{border-color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a.card b{display:block;font:700 1.2rem Georgia,serif}
.tag{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:99px;background:var(--amber);color:#12303f;font-size:.85rem;font-weight:600}
.mute{color:var(--mute);font-size:.9rem}
button{font:inherit;font-weight:700;border:2px solid #2d5e74;border-radius:10px;padding:6px 12px;cursor:pointer;background:var(--panel);color:var(--ink);float:right}
</style>
</head>
<body>
<main>
<button id="lg"></button>
<h1>Project KALASAG</h1>
<p data-k="intro"></p>
<a class="card" href="phase1.html"><b data-k="a1"></b><span data-k="d1"></span><br><span class="tag" id="s1"></span></a>
<a class="card" href="phase2.html"><b data-k="a2"></b><span data-k="d2"></span><br><span class="tag" id="s2"></span></a>
<a class="card" href="gobag.html"><b data-k="a3"></b><span data-k="d3"></span><br><span class="tag" id="s3"></span></a>
<a class="card" href="sim.html"><b data-k="a4"></b><span data-k="d4"></span><br><span class="tag" id="s4"></span></a>
<p class="mute" data-k="soon"></p>
<p class="mute" data-k="priv"></p>
</main>
<script src="profile.js"></script>
<script>
const T={en:{intro:"Get ready before the water, the shaking or the wind arrives. Work through the four phases in order, or jump to any of them.",
a1:"Phase 1: Know your risk",d1:"Pick the hazards near your home and test your warning knowledge.",
a2:"Phase 2: Reality check",d2:"Guess how long you could last on your own, then count.",
a3:"Phase 3: Build your go bag",d3:"Tick what you have really packed and see what is missing.",
a4:"Phase 4: Simulations",d4:"Flood, earthquake, typhoon, tsunami, storm surge, volcano and landslide. Fail safely, rewind, try again.",
soon:"",priv:"Your answers stay on this device. Nothing is sent anywhere.",
lg:"Filipino",todo:"Not started",done:"Done",none:"Bag empty",partial:"Bag partly packed",ready:"Bag ready",go:"Game overs found: "},
tl:{intro:"Maghanda bago dumating ang baha, lindol o hangin. Sundin ang apat na phase nang paisa-isa, o pumili ng alinman.",
a1:"Phase 1: Alamin ang inyong panganib",d1:"Piliin ang mga panganib malapit sa inyong tahanan at subukin ang inyong kaalaman sa mga babala.",
a2:"Phase 2: Pagsusuri ng realidad",d2:"Hulaan kung gaano katagal kayong tatagal nang mag-isa, saka bilangin.",
a3:"Phase 3: Buuin ang inyong go bag",d3:"Lagyan ng tsek ang tunay na nakahanda at tingnan ang kulang.",
a4:"Phase 4: Mga Simulation",d4:"Baha, lindol, bagyo, tsunami, storm surge, bulkan at landslide. Magkamali nang ligtas, bumalik, at subukan muli.",
soon:"",priv:"Nananatili sa device na ito ang inyong mga sagot. Walang ipinapadala kahit saan.",
lg:"English",todo:"Hindi pa nasisimulan",done:"Tapos na",none:"Walang laman ang bag",partial:"Kalahati ang laman ng bag",ready:"Handa na ang bag",go:"Mga game over na natuklasan: "}};
let L=KP.lang();
function draw(){
 const t=T[L],p=KP.get();document.documentElement.lang=L;
 document.querySelectorAll("[data-k]").forEach(e=>e.textContent=t[e.dataset.k]);
 lg.textContent=t.lg;
 s1.textContent=(p.p1||{}).done?t.done:t.todo;
 s2.textContent=(p.p2||{}).done?t.done:t.todo;
 s3.textContent=(p.p3||{}).level?t[p.p3.level]:t.todo;
 let n=0;try{["kalasag_over","kalasag_over_quake","kalasag_over_tsunami","kalasag_over_typhoon","kalasag_over_surge","kalasag_over_volcano","kalasag_over_slide"].forEach(k=>{n+=JSON.parse(localStorage.getItem(k)||"[]").length})}catch(e){}
 s4.textContent=t.go+n;
}
lg.onclick=()=>{L=L==="en"?"tl":"en";KP.setLang(L);draw()};
draw();
</script>
</body>
</html>
