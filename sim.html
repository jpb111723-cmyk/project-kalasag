<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation · Project KALASAG</title>
<style>
:root{--bg:#12303f;--panel:#1b4152;--ink:#e9f1f4;--mute:#a9c3cd;--water:#2f8fa3;--amber:#f2b441;--orange:#ee8a2b;--red:#d6453d;--green:#4cae7f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:.2em 0 .5em}
h1{font-size:2rem}h2{font-size:1.3rem}
p{margin:.4em 0 1em}
a{color:var(--amber)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:600;color:#12303f}
.scene{position:relative;border-radius:14px;overflow:hidden;background:#0d2230;margin:12px 0}
.scene svg{display:block;width:100%;height:auto}
.water{transition:transform 2.4s ease-in-out}
.wave{animation:wave 3s linear infinite}
@keyframes shake{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
@keyframes wave{to{transform:translateX(-40px)}}
.rain line{stroke:#9ccfe0;stroke-width:1;opacity:.5;animation:rain .9s linear infinite}
@keyframes rain{from{transform:translateY(-20px)}to{transform:translateY(150px)}}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,20,30,.55);opacity:0;animation:fade 1s 2s forwards}
.over b{font:700 2.2rem Georgia,serif;color:var(--red);letter-spacing:.04em}
@keyframes fade{to{opacity:1}}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid #2d5e74;border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;width:100%;margin:6px 0}
button:hover{border-color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button.go{background:var(--amber);color:#12303f;border-color:var(--amber);font-weight:700;text-align:center}
.card{background:var(--panel);border-radius:12px;padding:12px 14px;margin:10px 0}
.card small,.mute{color:var(--mute)}
.mute{font-size:.9rem}
@media (prefers-reduced-motion:reduce){.wave,.rain line{animation:none}.water{transition:none}.over{animation:none;opacity:1}}

.sm{float:right;width:auto;margin:0;padding:6px 12px;text-align:center}
label.i{display:flex;gap:10px;margin:12px 0;cursor:pointer;align-items:flex-start}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:#f2b441}
button.lock{opacity:.55;cursor:not-allowed;border-style:dashed}
button.lock small{display:block;margin-top:4px;color:var(--amber)}
</style>
</head>
<body>
<main id="app"></main>
<script src="profile.js"></script>
<script>
const SC={flood:{t:["Habagat Night","Gabi ng Habagat"],ready:1},quake:{t:["Earthquake","Lindol"],ready:1},tsunami:{t:["Tsunami","Tsunami"],ready:1},typhoon:{t:["Typhoon and flash flood","Bagyo at flash flood"],ready:1},surge:{t:["Storm surge","Storm surge"],ready:1},slide:{t:["Landslide","Landslide"],ready:1},volcano:{t:["Volcanic eruption","Pagputok ng bulkan"],ready:1}};
const U={en:{lg:"Filipino",back:"Back to menu",pick:"Choose a simulation",soon:"Coming soon",demo:"Demo mode: ignore my profile and unlock every option",start:"Begin",dec:"Decision",of:"of",nx:"Next decision",see:"See what you can learn",rw:"Rewind to this decision",chose:"You chose: ",over:"GAME OVER",locked:"Locked: ",deb:"What to take from this",you:"You chose:",best:"Best choice:",lkb:"This option was locked for you. ",fix:"Unlock it",src:"Source: ",fine:"Nothing to fix here. ",rew:" · you rewound here",prep:"Before the next time",again:"Play again",found:"Game overs found: ",note:"Prototype content. Verify every answer against the primary PAGASA, OCD, PHIVOLCS and DOH documents, and have a barangay DRRM officer review it, before public release."},
tl:{lg:"English",back:"Bumalik sa menu",pick:"Pumili ng simulation",soon:"Paparating pa lang",demo:"Demo mode: huwag pansinin ang aking profile at buksan ang lahat ng opsyon",start:"Simulan",dec:"Desisyon",of:"sa",nx:"Susunod na desisyon",see:"Tingnan ang matututunan",rw:"Bumalik sa desisyong ito",chose:"Pinili ninyo: ",over:"GAME OVER",locked:"Nakasara: ",deb:"Mga dapat tandaan",you:"Pinili ninyo:",best:"Pinakamahusay na pagpili:",lkb:"Nakasara ang opsyong ito para sa inyo. ",fix:"Buksan ito",src:"Pinagmulan: ",fine:"Walang kailangang ayusin dito. ",rew:" · bumalik kayo rito",prep:"Bago ang susunod na pagkakataon",again:"Maglaro muli",found:"Mga game over na natuklasan: ",note:"Prototype na nilalaman. Beripikahin ang bawat sagot sa orihinal na dokumento ng PAGASA, OCD, PHIVOLCS at DOH, at ipasuri sa DRRM officer ng barangay, bago ilabas sa publiko."}};
const TIER=[["Wrong","Mali"],["Risky","Delikado"],["Fair","Katamtaman"],["Good","Mabuti"],["Best","Pinakamahusay"]],TC=["#d6453d","#ee8a2b","#f2b441","#8cc084","#4cae7f"];
const R={red:p=>((p.p1||{}).answers||[])[0]===2,bag:p=>(p.p3||{}).level&&p.p3.level!=="none",hazflood:p=>((p.p1||{}).hazards||[]).includes("flood"),lepto:p=>((p.p1||{}).answers||[])[2]===0,boots:p=>!!((p.p3||{}).flags||{}).boots,
fault:p=>((p.p1||{}).hazards||[]).includes("fault"),coast:p=>((p.p1||{}).hazards||[]).includes("coast"),slope:p=>((p.p1||{}).hazards||[]).includes("slope"),volcano:p=>((p.p1||{}).hazards||[]).includes("volcano"),
p1:p=>!!(p.p1||{}).done,p2:p=>!!(p.p2||{}).done,supply:p=>((p.p2||{}).actual||0)>=3};
const LKD={fault:["You haven’t checked your fault-line risk (Phase 1).","Hindi pa ninyo nasusuri ang panganib ng fault line (Phase 1).","phase1.html"],
coast:["You haven’t marked coastal or storm-surge risk (Phase 1).","Hindi pa ninyo namamarkahan ang panganib sa baybayin o storm surge (Phase 1).","phase1.html"],
slope:["You haven’t marked slope or landslide risk (Phase 1).","Hindi pa ninyo namamarkahan ang panganib ng landslide (Phase 1).","phase1.html"],
volcano:["You haven’t marked a nearby volcano (Phase 1).","Hindi pa ninyo namamarkahan ang bulkang malapit (Phase 1).","phase1.html"],
p1:["You haven’t completed Phase 1.","Hindi pa tapos ang Phase 1.","phase1.html"],
p2:["You haven’t done the reality check (Phase 2).","Hindi pa ninyo nagagawa ang reality check (Phase 2).","phase2.html"],
supply:["Your supplies wouldn’t last 3 days (Phase 2).","Hindi aabot ng 3 araw ang inyong suplay (Phase 2).","phase2.html"],
bag:["No go bag packed yet (Phase 3).","Wala pang nakahandang go bag (Phase 3).","gobag.html"],
red:["You haven’t learned what a red warning means (Phase 1).","Hindi pa ninyo natututunan kung ano ang ibig sabihin ng pulang babala (Phase 1).","phase1.html"],
hazflood:["You haven’t mapped your flood risk (Phase 1).","Hindi pa ninyo namamapa ang panganib ng baha (Phase 1).","phase1.html"],
boots:["No boots in your go bag (Phase 3).","Walang bota sa inyong go bag (Phase 3).","gobag.html"],
lepto:["You haven’t learned the 24 to 48 hour rule (Phase 1).","Hindi pa ninyo natututunan ang 24 hanggang 48 oras na patakaran (Phase 1).","phase1.html"]};
function norm(S){S.d.forEach(d=>{d.o=d.o.map(o=>{if(!Array.isArray(o))return o;const r={tier:o[0],x:o[1],c:o[2]};if(o[0]===4&&d.req){const l=LKD[d.req];r.req=d.req;r.lk=[l[0],l[1]];r.ph=l[2]}return r})});return S}
const $=s=>document.querySelector(s),id=new URLSearchParams(location.search).get("s"),app=$("#app");
let L=KP.lang(),S,demo=false,SCEN;
const li=()=>L==="en"?0:1,x=a=>a[li()],u=k=>U[L][k];
const open=o=>demo||!o.req||!!R[o.req](KP.get());
const okey=()=>id==="flood"?"kalasag_over":"kalasag_over_"+id;
const ends=()=>{try{return JSON.parse(localStorage.getItem(okey())||"[]")}catch(e){return[]}};
const addEnd=i=>{try{const a=ends();if(!a.includes(i)){a.push(i);localStorage.setItem(okey(),JSON.stringify(a))}}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function scene(w,over){
 const k=(window.SCEN&&SCEN.kind)||"flood",wet=["flood","typhoon","tsunami","surge"].includes(k),rainy=["flood","typhoon"].includes(k),ash=k==="volcano";
 let rain="";if(rainy||ash)for(let i=0;i<16;i++)rain+=`<line x1="${i*21+5}" y1="0" x2="${i*21+(k==="typhoon"?-8:2)}" y2="12" style="animation-delay:${-(i*.17)%.9}s;${ash?"stroke:#b8b8b8;animation-duration:2.2s":""}"/>`;
 const y=-Math.round(w*72),sh=k==="quake"?(over?"":"animation:shake .35s linear infinite"):"";
 const sky=ash?"#2a2020":k==="surge"||k==="tsunami"?"#14283a":"#0d2230";
 let extra="";
 if(ash)extra=`<polygon points="190,120 250,40 310,120" fill="#3b2f2f"/><circle cx="250" cy="40" r="${6+w*14}" fill="#e2572b" opacity=".85"/>`;
 if(k==="slide")extra=`<polygon points="170,40 320,40 320,120" fill="#6b4f3a" style="transform:translate(${Math.round(w*-60)}px,${Math.round(w*20)}px);transition:transform 2.4s"/>`;
 if(k==="quake")extra=`<path d="M0 130 L60 124 L90 136 L150 126 L200 138 L320 128" stroke="#12303f" stroke-width="${1+w*4}" fill="none"/>`;
 return `<div class="scene"><svg viewBox="0 0 320 150" role="img" aria-label="Scene">
 <rect width="320" height="150" fill="${sky}"/>${extra}<g class="rain">${rain}</g>
 <g style="${sh}"><rect x="170" y="62" width="120" height="58" fill="#4a5d6b"/><polygon points="162,62 230,30 298,62" fill="#33444f"/><rect x="215" y="86" width="22" height="34" fill="#243540"/>
 <g><circle cx="${over?232:70}" cy="${over?24:92}" r="7" fill="#f2b441"/><rect x="${over?227:65}" y="${over?32:100}" width="10" height="${over?14:20}" rx="4" fill="#e9f1f4"/></g></g>
 <rect x="0" y="120" width="320" height="30" fill="#1d2e38"/>
 ${wet?`<g class="water" style="transform:translateY(${y}px)"><g class="wave"><rect x="-40" y="132" width="400" height="120" fill="#2f8fa3" opacity=".82"/><path d="M-40 132q10-6 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#9ccfe0" stroke-width="2"/></g></g>`:""}
 </svg>${over?'<div class="over"><b>GAME OVER</b></div>':""}</div>`;
}

const badge=t=>`<span class="chip" style="background:${TC[t]}">${TIER[t][li()]}</span>`;
const head=()=>`<button class="sm" id="lg">${u("lg")}</button><p class="mute"><a href="index.html">${u("back")}</a></p>`;
const bindLg=f=>{$("#lg").onclick=()=>{L=L==="en"?"tl":"en";KP.setLang(L);f()}};
function chooser(){
 app.innerHTML=head()+`<h1>${u("pick")}</h1>`+Object.keys(SC).map(k=>SC[k].ready?`<a class="card" href="sim.html?s=${k}" style="display:block;color:inherit;text-decoration:none"><b>${x(SC[k].t)}</b></a>`:`<div class="card mute"><b>${x(SC[k].t)}</b><br>${u("soon")}</div>`).join("");
 bindLg(chooser);
}
function home(){
 app.innerHTML=head()+`<h1>${x(SCEN.title)}</h1><p>${x(SCEN.intro)}</p>${scene(.3,false)}<label class="i"><input type="checkbox" id="dm" ${demo?"checked":""}><span>${u("demo")}</span></label><button class="go" id="go">${u("start")}</button><p class="mute">${u("found")}${ends().length} / ${SCEN.d.length}</p>`;
 bindLg(home);$("#dm").onchange=e=>{demo=e.target.checked};
 $("#go").onclick=()=>{S={i:0,picks:[],rew:[]};ask()};
}
function ask(){
 const d=SCEN.d[S.i],ord=shuffle(d.o.map((_,k)=>k));
 app.innerHTML=head()+`<span class="chip" style="background:${d.c}">${d.t}</span> <span class="mute">${u("dec")} ${S.i+1} ${u("of")} ${SCEN.d.length}</span>${scene(S.i?SCEN.d[S.i-1].w:.2,false)}<h2>${x(d.q)}</h2>`+
 ord.map(k=>{const o=d.o[k];return open(o)?`<button data-k="${k}">${x(o.x)}</button>`:`<button class="lock" disabled>${x(o.x)}<small>${u("locked")}${x(o.lk)}</small></button>`}).join("");
 bindLg(ask);app.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>pick(+b.dataset.k));window.scrollTo(0,0);
}
function pick(k){
 const d=SCEN.d[S.i],o=d.o[k];
 if(o.tier===0){addEnd(S.i);
  app.innerHTML=`${scene(1.1,true)}<h2>${x(o.c)}</h2><p class="mute">${u("chose")}${x(o.x)}</p><button class="go" id="rw">${u("rw")}</button>`;
  $("#rw").onclick=()=>{if(!S.rew.includes(S.i))S.rew.push(S.i);ask()};return}
 S.picks[S.i]=k;
 app.innerHTML=`${badge(o.tier)}${scene(d.w,false)}<h2>${x(o.c)}</h2><button class="go" id="nx">${S.i<SCEN.d.length-1?u("nx"):u("see")}</button>`;
 $("#nx").onclick=()=>{S.i++;S.i<SCEN.d.length?ask():debrief()};
}
function debrief(){
 let h=head()+`<h1>${u("deb")}</h1>`;
 SCEN.d.forEach((d,i)=>{const o=d.o[S.picks[i]],b=d.o.find(y=>y.tier===4),rw=S.rew.includes(i),lb=!open(b);
  h+=`<div class="card">${badge(o.tier)} <small>${d.t}${rw?u("rew"):""}</small><p><b>${u("you")}</b> ${x(o.x)}</p>`;
  if(o.tier<4){h+=`<p><b>${u("best")}</b> ${x(b.x)}</p>`+(lb?`<p>${u("lkb")}${x(b.lk)} <a href="${b.ph}">${u("fix")}</a></p>`:"")+`<p>${x(d.why)}</p><small>${u("src")}${d.src}</small>`}
  else h+=`<small>${u("fine")}${x(d.why)}</small>`;
  h+=`</div>`});
 h+=`<h2>${u("prep")}</h2><div class="card">${SCEN.next.map(n=>`<p>${x(n)}</p>`).join("")}</div><button class="go" id="again">${u("again")}</button><p class="mute">${u("note")}</p>`;
 app.innerHTML=h;bindLg(debrief);$("#again").onclick=home;window.scrollTo(0,0);
}
if(!id||!SC[id]||!SC[id].ready)chooser();
else{const s=document.createElement("script");s.src="scenarios/"+id+".js";s.onload=()=>{SCEN=norm(window.SCEN);home()};s.onerror=()=>{app.textContent="Could not load this scenario."};document.head.appendChild(s)}
</script>
</body>
</html>
